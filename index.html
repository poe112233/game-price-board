<title>游戏物价波动看板</title>
<style>
:root{
  --bg:#0a0d14;--card:#131826;--card2:#1a2133;--line:#242e47;
  --txt:#e9edf6;--dim:#8b95ab;--gold:#f2c14e;--gold2:#ffe29a;
  --up:#ff5f6d;--down:#37d98b;--flat:#8b95ab;
  --upbg:rgba(255,95,109,.12);--downbg:rgba(55,217,139,.12);
  --strong:#c6cede;--soft:rgba(255,255,255,.05);--soft2:rgba(255,255,255,.025);
  --soft3:rgba(255,255,255,.12);--dash:rgba(36,46,71,.6);--dash2:rgba(36,46,71,.7);
  --hoverline:#3a4666;--goldline:rgba(242,193,78,.4);--goldline2:rgba(242,193,78,.45);
  --goldline3:#f2c14e66;--focusring:rgba(242,193,78,.08);
  --chipon1:#3a2f14;--chipon2:#2a2410;
  --shadow:rgba(0,0,0,.35);--shadow2:rgba(0,0,0,.5);
  --maskbg:rgba(5,8,14,.72);--pointstroke:#0a0d14;
  --title1:#ffe29a;--title2:#f2c14e;--title3:#e88f4a;
  --modalbd:#2c3856;--barup1:#ff5f6d;--barup2:#ff9a6d;--bardown1:#2bbf78;--bardown2:#7be0a0;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#eef1f8;--card:#ffffff;--card2:#f7f9fe;--line:#dce2ef;
  --txt:#222a40;--dim:#69748f;--gold:#b8860b;--gold2:#8a5f00;
  --up:#e0244a;--down:#0c9d5c;--flat:#69748f;
  --upbg:rgba(224,36,74,.09);--downbg:rgba(12,157,92,.1);
  --strong:#3c4560;--soft:rgba(34,42,64,.055);--soft2:rgba(34,42,64,.03);
  --soft3:rgba(34,42,64,.1);--dash:rgba(120,132,160,.45);--dash2:rgba(120,132,160,.55);
  --hoverline:#a8b4d0;--goldline:rgba(184,134,11,.45);--goldline2:rgba(184,134,11,.5);
  --goldline3:rgba(184,134,11,.4);--focusring:rgba(184,134,11,.1);
  --chipon1:#f9efd6;--chipon2:#f3e4bc;
  --shadow:rgba(90,105,140,.16);--shadow2:rgba(90,105,140,.22);
  --maskbg:rgba(235,239,248,.72);--pointstroke:#ffffff;
  --title1:#b8860b;--title2:#9a6a00;--title3:#7a5200;
  --modalbd:#c9d2e6;--barup1:#e0244a;--barup2:#ff8a5c;--bardown1:#0c9d5c;--bardown2:#5cc793;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 520px at 75% -8%,var(--glow1) 0%,rgba(0,0,0,0) 60%),
    radial-gradient(900px 500px at -10% 20%,var(--glow2) 0%,rgba(0,0,0,0) 55%),
    var(--bg);
  color:var(--txt);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  padding:30px 18px 70px;line-height:1.5;
  transition:background .3s,color .3s;
}
:root{--glow1:#1c2444;--glow2:#141b33}
html[data-theme="light"]{--glow1:#dde5f5;--glow2:#e6ebf7}
.wrap{max-width:1280px;margin:0 auto}

/* ── 头部 ── */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:30px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(92deg,var(--title1),var(--title2) 45%,var(--title3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.sub b{color:var(--strong);font-weight:600}
/* ── 币价走势独立面板 ── */
.coinpanel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:16px;padding:16px 20px 12px;margin-bottom:14px}
.cph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cpt{font-size:17px;font-weight:800}
.cpbadge{font-size:11px;color:var(--gold2);border:1px solid var(--goldline);border-radius:6px;
  padding:1px 7px;vertical-align:2px;margin-left:5px;font-weight:600}
.cptabs{display:flex;gap:8px;align-items:center}
.cptab{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.cptab:hover{color:var(--txt);border-color:var(--hoverline)}
.cptab.on{background:linear-gradient(92deg,var(--chipon1),var(--chipon2));border-color:var(--goldline2);
  color:var(--gold2);font-weight:700}
.cprange{font-size:12px;color:var(--dim);margin-top:4px}
/* 「更多」时间维度下拉 */
.cpmore{position:relative}
.cpcaret{font-size:10px;margin-left:4px;display:inline-block;transition:transform .15s}
.cpmore.open .cpcaret{transform:rotate(180deg)}
.cpmenu{position:absolute;right:0;top:calc(100% + 6px);min-width:128px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 26px var(--shadow2);display:none;z-index:60}
.cpmore.open .cpmenu{display:block}
.cpitem{display:block;width:100%;text-align:left;background:none;border:0;color:var(--dim);
  font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.cpitem:hover{background:var(--soft);color:var(--txt)}
.cpitem.on{color:var(--gold2);font-weight:700;
  background:linear-gradient(92deg,var(--chipon1),var(--chipon2))}
.cpkpi{display:flex;gap:30px;flex-wrap:wrap;margin:14px 0 2px}
.cpk{font-size:12px;color:var(--dim)}
.cpk b{display:block;font-size:20px;font-weight:800;margin-top:2px;color:var(--strong)}
.cpk b.up{color:var(--up)}.cpk b.down{color:var(--down)}.cpk b.flat{color:var(--flat)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:14px;padding:13px 16px}
.kt{font-size:12px;color:var(--dim)}
.kt.up{color:var(--up)}.kt.down{color:var(--down)}
.kv{font-size:25px;font-weight:800;margin-top:4px}
.kv.up{color:var(--up)}.kv.down{color:var(--down)}
.kv span{font-size:12px;font-weight:600;color:var(--dim);margin-left:4px}

/* ── 排行榜 ── */
.sechead{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px;font-size:17px;font-weight:700}
.hint{font-size:12px;color:var(--dim);font-weight:400}
.rank{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.rank{grid-template-columns:1fr}}
.rankcol{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.rtitle{font-size:13.5px;font-weight:700;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.rtitle.up{color:var(--up)}.rtitle.down{color:var(--down)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 88px 62px 86px;align-items:center;gap:8px;
  padding:6.5px 0;border-bottom:1px dashed var(--dash);cursor:pointer;font-size:13px}
.rrow:last-child{border-bottom:none}
.rrow:hover .rname{color:var(--gold2)}
.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:4px}
.rbar i.up{background:linear-gradient(90deg,var(--barup1),var(--barup2))}
.rbar i.down{background:linear-gradient(90deg,var(--bardown1),var(--bardown2))}
.rpct{text-align:right;font-weight:700}
.rpct.up{color:var(--up)}.rpct.down{color:var(--down)}
.rprice{text-align:right;color:var(--dim);font-size:12.5px}
.rempty{color:var(--dim);font-size:13px;padding:18px 0;text-align:center}

/* ── 工具栏 ── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 12px}
.searchbox{flex:1;min-width:260px;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px;transition:.2s}
.searchbox:focus-within{border-color:var(--goldline3);box-shadow:0 0 0 3px var(--focusring)}
.searchbox .ico{font-size:15px;opacity:.8}
.searchbox input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;height:100%}
.searchbox input::placeholder{color:var(--dim)}
select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;
  height:44px;padding:0 12px;font-size:14px;outline:none;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{color:var(--txt);border-color:var(--hoverline)}
.chip.on{background:linear-gradient(92deg,var(--chipon1),var(--chipon2));border-color:var(--goldline2);color:var(--gold2)}
.chip b{opacity:.6;font-weight:600;margin-left:4px}
.count{font-size:12.5px;color:var(--dim);margin:2px 0 8px}

/* ── 物品卡片 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;margin-top:8px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--goldline);box-shadow:0 10px 30px var(--shadow)}
.c1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un{flex:0 0 auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.c2{font-size:12px;color:var(--dim);margin:2px 0 8px}
.c3 svg{width:100%;height:46px;display:block;background:var(--soft2);border-radius:8px}
.c4{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.pv{font-size:21px;font-weight:800;color:var(--gold2)}
.bd{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}
.bd.up{color:var(--up);background:var(--upbg)}
.bd.down{color:var(--down);background:var(--downbg)}
.bd.flat{color:var(--flat);background:var(--soft)}
.c5{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);gap:4px}
.c5 span{font-size:11px;color:var(--dim)}
.c5 b{color:var(--strong);font-weight:600;display:block;font-size:12.5px;margin-top:1px}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:70px 0;font-size:14.5px}

/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:var(--maskbg);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.mask.show{display:flex}
.modal{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--modalbd);border-radius:18px;
  max-width:780px;width:100%;padding:22px 24px;position:relative;box-shadow:0 24px 80px var(--shadow2)}
.x{position:absolute;top:14px;right:14px;background:var(--soft2);border:none;color:var(--dim);
  width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px}
.x:hover{color:var(--txt);background:var(--soft3)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;padding-right:36px}
.mt{font-size:20px;font-weight:800}
.mt .un{vertical-align:2px;margin-left:6px}
.mc{font-size:12.5px;color:var(--dim);margin-top:2px}
svg.big{width:100%;height:auto;display:block;margin-top:4px}
svg.big .ax{fill:var(--dim);font-size:12px}
svg.big .pv{font-size:13px;font-weight:700}
.dt{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.dt th{color:var(--dim);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.dt td{padding:8px 10px;border-bottom:1px dashed var(--dash2)}
.dt td.up{color:var(--up)}.dt td.down{color:var(--down)}.dt td.flat{color:var(--dim)}
.mnote{margin-top:10px;font-size:12px;color:var(--dim)}

footer{margin-top:36px;color:var(--dim);font-size:12.5px;line-height:1.9;border-top:1px solid var(--line);padding-top:14px}
footer b{color:var(--txt);opacity:.75}

/* ── SVG 趋势线（颜色随主题与涨跌自动适配）── */
.up{--tc:var(--up)}.down{--tc:var(--down)}.flat{--tc:var(--flat)}
svg .tl{stroke:var(--tc);fill:none;stroke-linejoin:round;stroke-linecap:round}
svg .td{fill:var(--tc)}
svg.big .tl{stroke-width:2.5}
svg.big .pv{fill:var(--tc)}

/* ── 主题切换按钮 ── */
.theme-btn{position:fixed;top:16px;right:16px;z-index:60;width:42px;height:42px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer;
  box-shadow:0 4px 16px var(--shadow);transition:.2s;display:flex;align-items:center;justify-content:center}
.theme-btn:hover{border-color:var(--goldline);transform:rotate(18deg) scale(1.06)}
</style>
</head>

/* ===================== 运行时 ===================== */
/* 缺失值以 null 表示（用于某期才首次出现的品类），图表与统计自动跳过 */
const items = RAW.map((r,i)=>{
  const name=r[0],cat=r[1],unit=r[2],prices=r[3];
  const wan = prices.map(p => (p===null||p===undefined) ? null
    : (typeof p==="string" ? parseFloat(p) : (unit==="E" ? p*10000 : p)));
  const fin = wan.filter(v=>v!==null);
  const change = (fin.length>1 && fin[0]) ? (fin[fin.length-1]-fin[0])/fin[0]*100 : 0;
  let py=""; for(const ch of name){ const c=PY[ch]!==undefined?PY[ch]:ch; if(/[a-z0-9]/i.test(c)) py+=c; }
  return {idx:i,name,cat,unit,prices,wan,fin,change,isNew:fin.length===1,py:py.toLowerCase()};
});
const lastVal = a => { for(let i=a.length-1;i>=0;i--) if(a[i]!==null) return a[i]; return null; };

const $ = s=>document.querySelector(s);
let state = {q:"", cat:"全部", unit:"全部", sort:"def"};

function cls(c){ return c>0.005 ? "up" : (c<-0.005 ? "down" : "flat"); }
function pctTxt(c){ const r=Math.round(c*10)/10; return (r>0?"+":"")+r.toFixed(1)+"%"; }
function badge(c){ const k=cls(c); const a=k==="up"?"▲":(k==="down"?"▼":"—");
  return '<span class="bd '+k+'">'+a+" "+pctTxt(c)+"</span>"; }
function fmtRaw(p,u){ if(p===null||p===undefined) return "—"; return typeof p==="string" ? p.replace("W","万") : (u==="E" ? p+"亿" : p+"万"); }
function fmtWan(v){ if(v===null||v===undefined) return "—"; return v>=10000 ? parseFloat((v/10000).toFixed(2))+"亿" : parseFloat(v.toFixed(2))+"万"; }

function spark(wan){
  const W=240,H=44,pad=7;
  const vals=wan.filter(v=>v!==null);
  if(vals.length<2) return '<span style="opacity:.4;font-size:12px">—</span>';
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const k=cls((vals[vals.length-1]-vals[0])/vals[0]*100);
  const n=wan.length, pts=[];
  wan.forEach((v,i)=>{ if(v!==null) pts.push([ pad+i*(W-2*pad)/(n-1), H-pad-((v-mn)/rg)*(H-2*pad) ]); });
  const pl = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots = pts.map(p=>'<circle class="td" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>').join("");
  return '<svg class="'+k+'" viewBox="0 0 '+W+' '+H+'"><polyline class="tl" points="'+pl+
         '" stroke-width="2"/>'+dots+"</svg>";
}

function bigChart(it){
  const W=720,H=300,L=92,R=34,T=36,B=46;
  const wan=it.wan, n=wan.length;
  const vals=wan.filter(v=>v!==null);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const pad=(mx-mn)||Math.max(Math.abs(mx)*0.08,1);
  const lo=Math.max(0,mn-pad), hi=mx+pad;
  const X=i=>L+i*(W-L-R)/(n-1);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const k=cls(it.change);
  let grid="", ylab="";
  const steps=4;
  for(let s=0;s<=steps;s++){
    const v=lo+(hi-lo)*s/steps, y=Y(v);
    grid+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(128,140,170,.18)" stroke-width="1"/>';
    ylab+='<text x="'+(L-10)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+fmtWan(v)+"</text>";
  }
  const pts=[]; wan.forEach((v,i)=>{ if(v!==null) pts.push([X(i),Y(v)]); });
  const pl = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = "M"+pts[0][0].toFixed(1)+","+Y(lo).toFixed(1)+" L"+
    pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ")+" L"+
    pts[pts.length-1][0].toFixed(1)+","+Y(lo).toFixed(1)+" Z";
  const dots = wan.map((v,i)=>{
    if(v===null) return "";
    const px=X(i), py=Y(v);
    const a = i===0 ? "start" : (i===n-1 ? "end" : "middle");
    return '<circle class="td" cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="4.5" stroke="var(--pointstroke)" stroke-width="2"/>'+
      '<text x="'+px.toFixed(1)+'" y="'+(py-12).toFixed(1)+
      '" text-anchor="'+a+'" class="pv">'+fmtWan(v)+"</text>";
  }).join("");
  const xlab = DATES.map((d,i)=>'<text x="'+X(i).toFixed(1)+'" y="'+(H-B+26)+'" text-anchor="middle" class="ax">'+d+"</text>").join("");
  const gid="g"+it.idx;
  return '<svg viewBox="0 0 '+W+' '+H+'" class="big '+k+'"><defs><linearGradient id="'+gid+
    '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tc);stop-opacity:.26"/>'+
    '<stop offset="1" style="stop-color:var(--tc);stop-opacity:0"/></linearGradient></defs>'+
    grid+ylab+'<path d="'+area+'" fill="url(#'+gid+')"/>'+
    '<polyline class="tl" points="'+pl+'" stroke-width="2.5"/>'+
    dots+xlab+"</svg>";
}

function hit(it,q){
  const s=q.toLowerCase();
  return it.name.toLowerCase().includes(s) || it.py.includes(s) || it.cat.toLowerCase().includes(s);
}

function currentList(){
  return items.filter(it=>{
    if(state.cat!=="全部" && it.cat!==state.cat) return false;
    if(state.unit!=="全部" && it.unit!==state.unit) return false;
    if(state.q && !hit(it,state.q)) return false;
    return true;
  });
}
const SORTS = {
  def:(a,b)=>a.idx-b.idx,
  up:(a,b)=>b.change-a.change,
  down:(a,b)=>a.change-b.change,
  vol:(a,b)=>Math.abs(b.change)-Math.abs(a.change),
  price:(a,b)=>(lastVal(b.wan)||0)-(lastVal(a.wan)||0),
  name:(a,b)=>a.name.localeCompare(b.name,"zh-Hans-CN")
};

function cardHTML(it){
  const lastRaw = fmtRaw(it.prices[it.prices.length-1], it.unit);
  return '<div class="card" data-i="'+it.idx+'">'+
    '<div class="c1"><span class="nm">'+it.name+'</span><span class="un">'+(it.unit==="E"?"亿":"万")+"</span></div>"+
    '<div class="c2">'+it.cat+"</div>"+
    '<div class="c3">'+spark(it.wan)+"</div>"+
    '<div class="c4"><span class="pv">'+lastRaw+"</span>"+(it.isNew?'<span class="bd flat">新增</span>':badge(it.change))+"</div>"+
    '<div class="c5">'+DATES.map((d,j)=>"<span>"+d+"<b>"+fmtRaw(it.prices[j],it.unit)+"</b></span>").join("")+"</div>"+
  "</div>";
}

function renderGrid(){
  const list = currentList().sort(SORTS[state.sort]);
  $("#count").textContent = "共 "+list.length+" / "+items.length+" 件物品" + (state.q ? " · 关键词「"+state.q+"」" : "") + (state.cat!=="全部" ? " · 分类："+state.cat : "");
  $("#grid").innerHTML = list.length
    ? list.map(cardHTML).join("")
    : '<div class="empty">没有找到匹配的物品，换个关键词试试～</div>';
}

function renderChips(){
  const cats = ["全部", ...new Set(items.map(i=>i.cat))];
  $("#chips").innerHTML = cats.map(c=>{
    const n = c==="全部" ? items.length : items.filter(i=>i.cat===c).length;
    return '<button class="chip'+(state.cat===c?" on":"")+'" data-c="'+c+'">'+c+"<b>"+n+"</b></button>";
  }).join("");
}

function rrow(it,mx){
  const w = Math.max(6, Math.abs(it.change)/mx*100);
  return '<div class="rrow" data-i="'+it.idx+'">'+
    '<span class="rname">'+it.name+"</span>"+
    '<span class="rbar"><i class="'+cls(it.change)+'" style="width:'+w.toFixed(1)+'%"></i></span>'+
    '<span class="rpct '+cls(it.change)+'">'+pctTxt(it.change)+"</span>"+
    '<span class="rprice">'+fmtRaw(it.prices[it.prices.length-1],it.unit)+"</span></div>";
}
function renderRank(){
  const ups = items.filter(i=>i.change>0.005).sort((a,b)=>b.change-a.change).slice(0,10);
  const downs = items.filter(i=>i.change<-0.005).sort((a,b)=>a.change-b.change).slice(0,10);
  const mU = Math.max(...ups.map(i=>i.change), 0.001);
  const mD = Math.max(...downs.map(i=>Math.abs(i.change)), 0.001);
  $("#rankUp").innerHTML = ups.length ? ups.map(i=>rrow(i,mU)).join("") : '<div class="rempty">暂无上涨物品</div>';
  $("#rankDown").innerHTML = downs.length ? downs.map(i=>rrow(i,mD)).join("") : '<div class="rempty">暂无下跌物品</div>';
}

function renderKPI(){
  const upN = items.filter(i=>cls(i.change)==="up").length;
  const downN = items.filter(i=>cls(i.change)==="down").length;
  const flatN = items.length-upN-downN;
  const avgV = (items.reduce((s,i)=>s+Math.abs(i.change),0)/items.length).toFixed(1);
  $("#kpis").innerHTML =
    '<div class="kpi"><div class="kt">📦 追踪物品</div><div class="kv">'+items.length+"<span>件</span></div></div>"+
    '<div class="kpi"><div class="kt">🗓 数据期数</div><div class="kv">'+DATES.length+"<span>期</span></div></div>"+
    '<div class="kpi"><div class="kt up">▲ 上涨物品</div><div class="kv up">'+upN+"<span>件</span></div></div>"+
    '<div class="kpi"><div class="kt down">▼ 下跌物品</div><div class="kv down">'+downN+"<span>件</span></div></div>"+
    '<div class="kpi"><div class="kt">— 持平物品</div><div class="kv">'+flatN+"<span>件</span></div></div>"+
    '<div class="kpi"><div class="kt">📊 平均波动幅度</div><div class="kv">±'+avgV+"<span>%</span></div></div>";
}

/* 弹窗 */
function openModal(it){
  let rows="";
  for(let i=0;i<DATES.length;i++){
    let d="—", c="flat";
    if(i>0 && it.wan[i]!==null && it.wan[i-1]!==null){
      const pc=(it.wan[i]-it.wan[i-1])/it.wan[i-1]*100;
      d=pctTxt(pc); c=cls(pc);
    }
    rows+="<tr><td>"+DATES[i]+"</td><td>"+fmtRaw(it.prices[i],it.unit)+'</td><td class="'+c+'">'+d+"</td></tr>";
  }
  $("#modal").innerHTML =
    '<button class="x" onclick="closeModal()">✕</button>'+
    '<div class="mh"><div><div class="mt">'+it.name+'<span class="un">'+(it.unit==="E"?"亿":"万")+"</span></div>"+
    '<div class="mc">'+it.cat+" · 共 "+DATES.length+' 期</div></div>'+(it.isNew?'<span class="bd flat">新增</span>':badge(it.change))+"</div>"+
    bigChart(it)+
    '<table class="dt"><thead><tr><th>日期</th><th>价格</th><th>较上期</th></tr></thead><tbody>'+rows+"</tbody></table>"+
    '<div class="mnote">统一换算：'+it.wan.map((v,i)=>DATES[i]+" = "+fmtWan(v)).join(" · ")+"</div>";
  $("#mask").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeModal(){ $("#mask").classList.remove("show"); document.body.style.overflow=""; }

/* 事件 */
$("#grid").addEventListener("click",e=>{ const c=e.target.closest(".card"); if(c) openModal(items[+c.dataset.i]); });
$("#rankUp").addEventListener("click",e=>{ const c=e.target.closest(".rrow"); if(c) openModal(items[+c.dataset.i]); });
$("#rankDown").addEventListener("click",e=>{ const c=e.target.closest(".rrow"); if(c) openModal(items[+c.dataset.i]); });
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  state.cat=b.dataset.c; renderChips(); renderGrid();
});
$("#search").addEventListener("input",e=>{ state.q=e.target.value.trim(); renderGrid(); });
$("#unitSel").addEventListener("change",e=>{ state.unit=e.target.value; renderGrid(); });
$("#sortSel").addEventListener("change",e=>{ state.sort=e.target.value; renderGrid(); });
$("#mask").addEventListener("click",e=>{ if(e.target===$("#mask")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* 主题切换（记忆用户偏好，默认深色） */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = t==="light" ? "🌙" : "☀️";
}
(function(){
  const btn=document.getElementById("themeBtn");
  let saved="light";
  try{ saved=localStorage.getItem("priceboard-theme") || "light"; }catch(e){}
  applyTheme(saved);
  btn.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    applyTheme(cur);
    try{ localStorage.setItem("priceboard-theme", cur); }catch(e){}
  });
})();

/* ── 币价走势独立面板 ── */
function renderCoin(days){
  const n=Math.min(days,COIN.length);
  const ds=COIN_DATES.slice(-n), vs=COIN.slice(-n);
  const first=vs[0], last=vs[vs.length-1];
  const chg=(last-first)/first*100, k=cls(chg);
  /* 顶部范围提示：如实反映实际收录天数（选 180/365 天而数据不足时会说明） */
  const rgEl=$("#coinRange");
  if(rgEl){
    let txt=ds[0]+" – "+ds[ds.length-1]+" · 共 "+vs.length+" 天";
    if(days>COIN.length) txt+=" · 数据自 "+COIN_DATES[0]+" 起，暂无更早记录";
    rgEl.textContent=txt;
  }
  $("#coinKpi").innerHTML =
    '<div class="cpk">当前（'+ds[ds.length-1]+'）<b>'+last+'</b></div>'+
    '<div class="cpk">期间涨跌<b class="'+k+'">'+(chg>0?"+":"")+chg.toFixed(2)+'%</b></div>'+
    '<div class="cpk">期间最高<b>'+Math.max(...vs)+'</b></div>'+
    '<div class="cpk">期间最低<b>'+Math.min(...vs)+'</b></div>';
  const W=1160,H=200,L=64,R=26,T=18,B=36;
  const mn=Math.min(...vs), mx=Math.max(...vs);
  const pad=(mx-mn)||Math.max(mx*0.004,0.5);
  const lo=mn-pad, hi=mx+pad;
  const X=i=>L+i*(W-L-R)/(vs.length-1);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let grid="",ax="";
  for(let s=0;s<=4;s++){
    const v=lo+(hi-lo)*s/4, y=Y(v);
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--dash)" stroke-width="1" stroke-dasharray="4 5"/>';
    ax+='<text class="ax" x="'+(L-10)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  const step=Math.ceil(vs.length/8);
  ds.forEach((d,i)=>{
    if(i%step===0||i===ds.length-1)
      ax+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-B+24)+'" text-anchor="middle">'+d+'</text>';
  });
  const pl=vs.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const dots=vs.map((v,i)=>'<circle class="td" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===vs.length-1?5:3.5)+'"/>').join("");
  /* 数值标签：点数少时全标；点数多时只标首点/末点/最高/最低，避免挤成一团 */
  const marks=new Set();
  if(vs.length<=10){ vs.forEach((v,i)=>marks.add(i)); }
  else {
    const edges=[0, vs.length-1];
    marks.add(0); marks.add(vs.length-1);
    /* 极值点若不挨着首末点才额外标注，避免标签叠字 */
    [vs.indexOf(mx), vs.indexOf(mn)].forEach(i=>{
      if(i>=0 && edges.every(e=>Math.abs(e-i)>1)) marks.add(i);
    });
  }
  const lbls=[...marks].sort((a,b)=>a-b).map(i=>{
    const v=vs[i], lastPt=i===vs.length-1;
    const anc=i===0?"start":(lastPt?"end":"middle");
    return '<text class="pv" x="'+X(i).toFixed(1)+'" y="'+(Y(v)-10).toFixed(1)+'" text-anchor="'+anc+'"'
      +(lastPt?"":' style="font-size:11px;opacity:.85"')+'>'+v+'</text>';
  }).join("");
  $("#coinBig").innerHTML='<svg class="big '+k+'" viewBox="0 0 '+W+' '+H+'">'+grid+ax+
    '<polyline class="tl" points="'+pl+'"/>'+dots+lbls+'</svg>';
}
/* 时间维度切换：近7天 / 近30天为常驻按钮，其余维度收在「更多」下拉里 */
const COIN_DEFAULT=30;
function setCoinDays(days){
  const more=$("#coinMore"), mbtn=$("#coinMoreBtn");
  document.querySelectorAll("#coinTabs .cptab[data-days]").forEach(t=>{
    t.classList.toggle("on", +t.dataset.days===days);
  });
  let inMenu=false, hitTxt="";
  document.querySelectorAll("#coinMenu .cpitem").forEach(t=>{
    const hit=+t.dataset.days===days;
    t.classList.toggle("on", hit);
    if(hit){ inMenu=true; hitTxt=t.textContent.trim(); }
  });
  if(mbtn){
    mbtn.classList.toggle("on", inMenu);
    mbtn.setAttribute("aria-expanded","false");
    mbtn.innerHTML=(inMenu?hitTxt:"更多")+'<span class="cpcaret">▼</span>';
  }
  if(more) more.classList.remove("open");
  renderCoin(days);
  try{ localStorage.setItem("priceboard-coindays", String(days)); }catch(e){}
}
$("#coinTabs").addEventListener("click",e=>{
  const item=e.target.closest(".cpitem");
  if(item){ setCoinDays(+item.dataset.days); return; }
  const btn=e.target.closest(".cptab");
  if(!btn) return;
  if(btn.id==="coinMoreBtn"){
    const open=$("#coinMore").classList.toggle("open");
    btn.setAttribute("aria-expanded", open?"true":"false");
    return;
  }
  setCoinDays(+btn.dataset.days);
});
/* 点击空白处或按 Esc 关闭下拉 */
document.addEventListener("click",e=>{
  const more=$("#coinMore"); if(!more || more.contains(e.target)) return;
  more.classList.remove("open");
  const b=$("#coinMoreBtn"); if(b) b.setAttribute("aria-expanded","false");
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  const more=$("#coinMore"); if(more) more.classList.remove("open");
  const b=$("#coinMoreBtn"); if(b) b.setAttribute("aria-expanded","false");
});
/* 初始维度：默认近30天，并记住上次选择 */
(function(){
  let d=COIN_DEFAULT;
  try{
    const s=parseInt(localStorage.getItem("priceboard-coindays")||"",10);
    if(s>0) d=s;
  }catch(e){}
  if([7,30,90,180,365].indexOf(d)<0) d=COIN_DEFAULT;
  setCoinDays(d);
})();
/* 页面顶部日期标签跟随 DATES 自动更新，避免每次新增期次手工改文案 */
(function(){
  const f=document.getElementById("firstDate"), l1=document.getElementById("lastDate"), l2=document.getElementById("lastDate2");
  if(f) f.textContent=DATES[0];
  if(l1) l1.textContent=DATES[DATES.length-1];
  if(l2) l2.textContent=DATES[DATES.length-1];
})();
renderKPI(); renderRank(); renderChips(); renderGrid();
</script>
