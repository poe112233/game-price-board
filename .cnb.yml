# 游戏物价波动看板 - CNB 云原生构建流水线
# push 到 main 分支时，自动把静态站点部署到 EdgeOne Makers (Pages)
#
# 参数说明：
#   -n  game-price-board     项目名（不存在会自动创建）
#   -t  $EDGEONE_API_TOKEN   Pages API Token，由仓库环境变量注入
#   -a  overseas             海外区域（域名未备案时必须用 overseas；备案后可改 global）
#   -e  production           生产环境
main:
  push:
    - stages:
        - name: Deploy to EdgeOne Pages
          image: node:22
          script: npx --yes edgeone@1.6.39 pages deploy ./ -n game-price-board -a overseas -e production -t $EDGEONE_API_TOKEN
